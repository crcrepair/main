<!--
  Fires a Meta Pixel "Lead" event when the Contact Form 7 form is sent successfully.
  Requires the Meta Pixel base code to already be on the page (e.g. via the
  "Meta Pixel for WordPress" plugin or your theme header).
  Add this to the landing page (Custom HTML block) or your site footer.
-->
<script>
  document.addEventListener('wpcf7mailsent', function (event) {
    if (!event.target.querySelector('.crc-lead-form') || !window.fbq) return;
    var device = '';
    event.detail.inputs.forEach(function (input) {
      if (input.name === 'your-device') device = input.value;
    });
    fbq('track', 'Lead', { content_name: device });
  }, false);
</script>
