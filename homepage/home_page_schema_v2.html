      "@type": "FAQPage",
      "@id": "https://www.crcrepair.co.uk/#faq",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How much does a phone screen replacement cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It depends on the model and the type of screen (OLED or LCD). Use the booking tool at the top of this page to get an instant price for your exact phone, or read our guide to iPhone screen repair costs in the UK. Prices are upfront with no hidden fees, and every phone screen we fit comes with a lifetime warranty."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a phone repair take? Can I get it done the same day?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Most phone screen repairs, battery replacements and common faults are completed the same day, often within 1–3 hours. More complex work such as motherboard or water-damage repair can take longer depending on diagnostics and parts availability."
          }
        },
        {
          "@type": "Question",
          "name": "Do you repair all phone brands?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We repair Apple iPhone, Samsung Galaxy, Google Pixel, Motorola, OnePlus, Oppo, Sony, Huawei, Xiaomi and most other Android phones."
          }
        },
        {
          "@type": "Question",
          "name": "Do you also repair tablets, laptops, MacBooks and games consoles?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We do. Our stores repair iPads and Android tablets, Windows laptops and desktop PCs, MacBooks, PlayStation, Xbox and Nintendo Switch consoles, smartwatches and fitness trackers, drones and other electronics. We also build custom gaming PCs."
          }
        },
        {
          "@type": "Question",
          "name": "Do you repair smartwatches and other wearables?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We repair smartwatches and fitness trackers, including Apple Watch and Samsung Galaxy Watch, covering screens, batteries and buttons. Book online or ask your nearest store for a quote."
          }
        },
        {
          "@type": "Question",
          "name": "Do your repairs come with a warranty?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Phone screen repairs have a lifetime warranty, and most other repairs – batteries, charging ports, cameras, tablets, laptops and consoles – carry a 12-month warranty covering parts and labour. Board-level soldering repairs are covered for three months."
          }
        },
        {
          "@type": "Question",
          "name": "What parts do you use – are they genuine?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We use genuine and OEM-quality replacement parts. Genuine Apple parts are available for iPhone repairs, Samsung repairs use genuine Samsung parts and Google Pixel repairs use genuine Google parts. Every device is tested before it goes back to you."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to book a repair in advance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Walk-ins are welcome at all 10 stores. Booking online is recommended, though, because it reserves your parts and secures the fastest turnaround."
          }
        },
        {
          "@type": "Question",
          "name": "What if I can't get to a store?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Besides in-store repair we offer a mail-in service, collection and drop-off, and a come-to-you doorstep service from selected stores. Choose the option that suits you when you book, or contact your nearest store."
          }
        },
        {
          "@type": "Question",
          "name": "Can you fix a water-damaged phone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Often, yes. Switch the phone off, don't charge it and bring it to us as soon as possible for liquid-damage cleaning and diagnostics. Read what to do with a water-damaged phone first – we'll tell you what can be saved before any work starts."
          }
        },
        {
          "@type": "Question",
          "name": "Where are your repair stores?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pocket Geek Tech Repair by CrC Repair® has 10 stores: Bournemouth, Colchester, Farringdon (London EC1), Glasgow (St Enoch Centre), Norwich, Romford, Stoke-on-Trent, Surrey Quays (London SE16), Whetstone (London N20) and Wolverhampton. Addresses, opening hours and phone numbers are on our store locator."
          }
        },
        {
          "@type": "Question",
          "name": "Do you buy phones and other devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Bring your old phone, tablet, laptop or console into any store for a cash offer, or check our trading price online. We also sell checked, pre-owned devices with a two-year warranty in our online store."
          }
        }
      ]
