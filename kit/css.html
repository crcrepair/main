<!-- wp:html -->
<style>
  :root{
    --ink:#101418;
    --ink-soft:#3d4650;
    --white:#ffffff;
    --accent:#4180d5;
    --accent-dark:#2c5da3;
    --steel:#1b2530;
    --line:#dfe4e9;
    --amber:#f0a500;
    --radius:14px;
  }
  .crc-page{font-family:'Montserrat',system-ui,-apple-system,sans-serif;color:var(--ink);line-height:1.65;font-size:16.5px}
  .crc-page h1,.crc-page h2,.crc-page h3{font-family:'Montserrat',system-ui,sans-serif;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin:0}
  .crc-page p{margin:0}
  .crc-page a{color:var(--accent)}
  .crc-page a:hover{color:var(--accent-dark)}
  .crc-page [id]{scroll-margin-top:24px}
  .crc-page .wp-block-group{margin:0}

  .crc-page .titlebox{padding:14px 0 22px}
  .crc-page .titlebox h1{font-size:clamp(21px,2.8vw,30px);font-weight:600}
  .crc-page .titlebox h1::after{content:"";display:block;width:64px;height:6px;background:var(--accent);border-radius:3px;margin-top:14px}

  .crc-page .jumpnav{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 10px rgba(16,20,24,.05);padding:14px 18px;display:flex;flex-wrap:wrap;gap:6px}
  .crc-page .jumpnav a{text-decoration:none;font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:7px 13px;border-radius:999px;border:1px solid var(--line)}
  .crc-page .jumpnav a:hover{background:var(--accent);border-color:var(--accent);color:#fff}

  .crc-page .block{padding:28px 0}
  .crc-page .block h2{font-size:clamp(18px,2.3vw,25px);margin-bottom:22px;text-align:center;color:var(--ink)}
  .crc-page .block h2::after{content:"";display:block;width:64px;height:6px;background:var(--accent);border-radius:3px;margin:12px auto 0}
  .crc-page .lede p{margin-bottom:16px;color:var(--ink-soft)}
  .crc-page .lede p:last-child{margin-bottom:0}

  .crc-page .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:0 2px 10px rgba(16,20,24,.05)}
  .crc-page .grid{display:grid;gap:20px}
  .crc-page .grid > *{margin:0}
  .crc-page .grid.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .crc-page .grid.c3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .crc-page .grid.c5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

  .crc-page .rcard h3{font-size:16px;margin-bottom:14px;padding-bottom:12px;border-bottom:3px solid var(--accent)}
  .crc-page .rcard p{color:var(--ink-soft);font-size:15px;margin-bottom:12px}
  .crc-page .rcard p:last-child{margin-bottom:0}
  .crc-page .sectionintro{margin-bottom:22px;color:var(--ink-soft)}

  .crc-page .chips{display:flex;flex-wrap:wrap;gap:10px}
  .crc-page .chips span{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--accent);padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:0 1px 4px rgba(16,20,24,.05);color:var(--ink);display:block}
  .crc-page .chips span b{display:block;font-weight:700;font-size:13px;color:var(--accent-dark)}

  .crc-page .note.card{border-top:6px solid var(--amber)}
  .crc-page .note.card p{color:var(--ink-soft);margin-bottom:14px}
  .crc-page .note.card p:last-child{margin-bottom:0}

  .crc-page .warranty.card{text-align:center;border-top:6px solid var(--accent)}
  .crc-page .warranty.card p{color:var(--ink-soft)}
  .crc-page .warranty.card .big{font-weight:900;font-size:24px;color:var(--accent);margin-bottom:10px}
  .crc-page .warranty.card h3{font-size:16px;margin-bottom:10px}

  .crc-page .why-tile{background:var(--steel);color:#fff;border-radius:12px;padding:24px 22px}
  .crc-page .why-tile h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;color:#fff}
  .crc-page .why-tile h3::before{content:"✔";color:var(--accent);background:#fff;width:24px;height:24px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
  .crc-page .why-tile p{color:#c8d2dc;font-size:14.5px}

  .crc-page .storegrid a{display:block;text-decoration:none}
  .crc-page .storegrid h3{background:var(--white);border:1px solid var(--line);border-bottom:5px solid var(--accent);border-radius:12px;padding:18px;font-size:15.5px;text-align:center;transition:.15s;color:var(--ink)}
  .crc-page .storegrid a:hover h3{background:var(--accent);color:#fff;border-color:var(--accent)}
  .crc-page .stores-after{margin-top:20px;text-align:center;color:var(--ink-soft);font-weight:500}

  .crc-page .gallery figure{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 10px rgba(16,20,24,.05);overflow:hidden;margin:0}
  .crc-page .gallery img{display:block;width:100%;height:auto}
  .crc-page .imgplaceholder{background:var(--white);border:2px dashed var(--line);border-radius:var(--radius);padding:34px 22px;text-align:center;color:var(--ink-soft);font-size:14px;font-weight:600}

  .crc-page .cta-banner{background:var(--accent);color:#fff;border-radius:var(--radius);padding:36px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
  .crc-page .cta-banner h2{color:#fff;text-align:left;margin:0}
  .crc-page .cta-banner h2::after{content:"";display:block;width:64px;height:6px;background:#fff;border-radius:3px;margin:12px 0 0}
  .crc-page .cta-banner .txt{flex:1 1 380px}
  .crc-page .cta-banner p{color:#eaf1fb;margin-top:14px}
  .crc-page .btn{display:inline-block;padding:13px 26px;border-radius:10px;font-weight:700;text-decoration:none;font-size:15px}
  .crc-page .btn.light{background:#fff;color:var(--accent)}
  .crc-page .btn.light:hover{background:#dbe7f7;color:var(--accent-dark)}
  .crc-page .btn.ghost{border:2px solid rgba(255,255,255,.7);color:#fff}
  .crc-page .btn.ghost:hover{background:rgba(255,255,255,.12);color:#fff}
  .crc-page .cta-banner .actions{display:flex;flex-wrap:wrap;gap:12px}
  @media (max-width:720px){
    .crc-page .cta-banner{justify-content:center;text-align:center}
    .crc-page .cta-banner h2{text-align:center}
    .crc-page .cta-banner h2::after{margin:12px auto 0}
    .crc-page .cta-banner .actions{width:100%;justify-content:center}
  }

  .crc-page .faq details{background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .crc-page .faq summary{cursor:pointer;padding:18px 22px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .crc-page .faq summary::-webkit-details-marker{display:none}
  .crc-page .faq summary h3{font-size:15px;font-weight:700}
  .crc-page .faq details[open] summary{border-bottom:1px solid var(--line)}
  .crc-page .faq summary::after{content:"+";font-weight:900;font-size:24px;color:var(--accent);flex-shrink:0}
  .crc-page .faq details[open] summary::after{content:"–"}
  .crc-page .faq .a{padding:16px 22px 20px;color:var(--ink-soft)}

  .crc-page :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
<!-- /wp:html -->
