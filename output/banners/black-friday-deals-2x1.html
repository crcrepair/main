<!-- CrC Black Friday deals box, 2:1 ratio, fluid width. Paste as one Custom HTML block (block editor) or into the TEXT tab (classic). Fills the width of whatever it sits in and keeps a 2:1 shape; "BLACK FRIDAY DEALS" centred, "Up to £100 OFF on devices" underneath. Same box, colours and fonts as the product short-description banner. -->

<div class="crc-bfd"><div class="crc-bf" role="note" aria-label="Black Friday deals: up to £100 off on devices"><span class="crc-bf-wm" aria-hidden="true">BLACK FRIDAY</span><div class="crc-bf-in"><div class="crc-bf-h">Black Friday <span class="crc-bf-gold">Deals</span></div><p class="crc-bf-offer">Up to <strong class="crc-bf-gold">£100 OFF</strong> on devices</p></div></div></div>
