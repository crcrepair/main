<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Friday Deal banner, 320 x 420</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent}
  .crc-bf{position:relative;overflow:hidden;width:320px;height:420px;box-sizing:border-box;padding:28px 24px 26px;border-radius:14px;
    background:radial-gradient(120% 140% at 100% 100%,rgba(242,193,78,.20) 0,rgba(242,193,78,0) 55%),
               repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 1px,transparent 1px 14px),#0b0f17;
    color:#fff;font-family:'Montserrat',system-ui,-apple-system,sans-serif;text-align:left;
    display:flex;flex-direction:column;justify-content:flex-end}
  .crc-bf-wm{position:absolute;right:-6px;top:22px;margin:0;font-size:92px;font-weight:900;line-height:.92;letter-spacing:-.02em;
    color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.09);pointer-events:none;user-select:none}
  .crc-bf-in{position:relative;z-index:1}
  .crc-bf-h{margin:0 0 12px;font-size:44px;font-weight:900;line-height:1.0;letter-spacing:-.02em;text-transform:uppercase;color:#fff}
  .crc-bf-gold{color:#f2c14e;background:linear-gradient(90deg,#f0b93a 0%,#f6d27a 55%,#fdebc0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .crc-bf-p{margin:0;font-size:15px;font-weight:500;line-height:1.5;color:#c3cad4}
</style>
</head>
<body>
<div class="crc-bf" role="img" aria-label="Black Friday deal">
  <div class="crc-bf-wm" aria-hidden="true">BLACK<br>FRIDAY</div>
  <div class="crc-bf-in">
    <div class="crc-bf-h">Black<br>Friday <span class="crc-bf-gold">Deal</span></div>
    <p class="crc-bf-p">Sharper price on the Galaxy S24 Ultra. Shop with our 2 year warranty, express delivery or collection from store.</p>
  </div>
</div>
</body>
</html>
